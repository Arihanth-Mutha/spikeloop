[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "spikeloop"
version = "0.1.0"
description = "Real-time spike detection for multi-electrode arrays, in Rust: bandpass, robust thresholds, stimulation-artifact blanking."
readme = "../../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Arihanth Mutha" }]
dependencies = ["numpy>=1.24"]
keywords = ["neuroscience", "spike-detection", "electrophysiology", "mea", "rust"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
test = ["pytest>=8", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/Arihanth-Mutha/spikeloop"

[tool.maturin]
python-source = "python"
module-name = "spikeloop._core"
