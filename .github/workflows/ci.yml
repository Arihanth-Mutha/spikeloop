name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy -p spikeloop-core --all-targets -- -D warnings
      - run: cargo test -p spikeloop-core
      - run: cargo run --release -p spikeloop-core --example evaluate

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install the extension
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest scipy
          cd crates/spikeloop-py && maturin develop --release
      - name: Test
        run: |
          . .venv/bin/activate
          pytest crates/spikeloop-py/tests -q
